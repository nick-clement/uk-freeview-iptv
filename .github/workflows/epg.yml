name: Update guide
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    paths: ["uk-freeview.m3u", "build_epg.py"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_epg.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          git diff --cached --quiet || git commit -m "Update guide data"
          git push
